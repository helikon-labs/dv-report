[workspace]
members = [
    "dv-report-api-service",
    "dv-report-config",
    "dv-report-indexer",
    "dv-report-logging",
    "dv-report-metrics",
    "dv-report-persistence",
    "dv-report-repository",
    "dv-report-service",
    "dv-report-subsquare-client",
    "dv-report-substrate-client",
    "dv-report-types",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
rust-version = "1.83.0"
edition = "2021"
description = "Submerge W3F DV Report Backend by Helikon"
repository = "https://github.com/helikon-labs/dv-report"
authors = ["kukabi <kutsal@helikon.io>"]
license = "GPL-3"

[workspace.dependencies]
actix-web = "4.11"
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = true, features = ["serde"] }
config = "0.15"
env_logger = "0.11"
frame-metadata = "23.0"
frame-support = "40.1"
frame-system = "40.1"
hex = "0.4"
jsonrpsee = "0.25"
jsonrpsee-core = "0.25"
lazy_static = "1.5"
log = "0.4"
once_cell = "1"
pallet-balances = "41.1"
parity-scale-codec = "3.7"
prometheus = "0.14"
reqwest = "0.12"
serde = "1"
serde_json = "1"
sp-core = "36.1"
subxt = { version = "0.42", features = ["reconnecting-rpc-client"] }
sqlx = "0.8"
thiserror = "2"
tokio = "1.45"