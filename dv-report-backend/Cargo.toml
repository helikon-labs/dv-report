[workspace]
members = [
    "dv-report-config",
    "dv-report-indexer",
    "dv-report-logging",
    "dv-report-metrics",
    "dv-report-persistence",
    "dv-report-service",
    "dv-report-subsquare-client",
    "dv-report-substrate-client",
    "dv-report-types",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
rust-version = "1.83.0"
edition = "2021"
description = "Submerge W3F DV Report Backend by Helikon"
repository = "https://github.com/helikon-labs/dv-report"
authors = ["kukabi <kutsal@helikon.io>"]
license = "GPL-3"

[workspace.dependencies]
actix-web = "4.8"
anyhow = "1"
async-recursion = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", default-features = true, features = ["serde"] }
config = "0.15"
env_logger = "0.11"
frame-metadata = "20.0"
frame-support = "39.0"
frame-system = "39.1"
hex = "0.4"
itertools = "0.14"
jsonrpsee = "0.24"
jsonrpsee-core = "0.24"
jsonrpsee-types = "0.24"
lazy_static = "1.5"
log = "0.4"
once_cell = "1"
pallet-balances = "40.0"
pallet-identity = "39.0"
parity-scale-codec = "3.6"
prometheus = "0.13"
rand = "0.9"
reqwest = "0.12"
rustc-hash = "2.0"
serde = "1"
serde_json = "1"
sp-core = "35.0"
subxt = { version = "0.42", features = ["reconnecting-rpc-client"] }
sqlx = "0.8"
thiserror = "2"
tokio = "1.41"