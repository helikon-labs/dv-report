<!doctype html>
<html lang="en">
    <head>
        <title>Submerge :: W3F DV Cohort IV Report</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
        />
        <link rel="stylesheet" href="./css/style.css" />
        <script src="https://kit.fontawesome.com/ebf2cd1147.js" crossorigin="anonymous"></script>
    </head>
    <body id="root" class="regular">
        <script src="./bundle.js"></script>
        <div class="page-header-container">
            <div class="page-header">
                <img class="submerge-logo" src="./img/submerge-logo.svg" alt="Submerge" />
                <!--img class="helikon-logo-full" src="./img/helikon-logo-full.svg" alt="Helikon"-->
                <img class="helikon-logo" src="./img/helikon-logo.svg" alt="Helikon" />
            </div>
            <hr />
        </div>
        <div class="filter-container">
            <span>Network:</span>
            <select>
                <option>All</option>
                <option selected>Polkadot</option>
                <option>Kusama</option>
            </select>
            <span>Track:</span>
            <select>
                <option>All</option>
                <option selected>DV Tracks</option>
                <option>Small Spender (31)</option>
            </select>
            <span>Status:</span>
            <select>
                <option>All</option>
                <option selected>Ongoing</option>
                <option>Confirmed</option>
            </select>
        </div>
        <div class="content-container">
            <div class="content" id="content">
                <div class="header-1 medium">W3F Decentralized Voices Cohort IV Report</div>
                <!-- activity -->
                <div class="section">
                    <div class="section-header">Activity</div>
                    <div class="section-body">
                        <svg id="chart" style="width: 100%"></svg>
                    </div>
                </div>
                <!-- breakdown -->
                <div class="section">
                    <div class="section-header">Breakdown</div>
                    <div class="section-body">Asd.</div>
                </div>
                <!-- policy -->
                <div class="section">
                    <div class="section-header">Policy</div>
                    <div class="section-body">Asd.</div>
                </div>
                <!-- similarity -->
                <div class="section">
                    <div class="section-header">Similarity</div>
                    <div class="section-body">Asd.</div>
                </div>
                <!-- speed -->
                <div class="section">
                    <div class="section-header">Speed</div>
                    <div class="section-body">Asd.</div>
                </div>
                <!-- consistency -->
                <div class="section">
                    <div class="section-header">Consistency</div>
                    <div class="section-body">Asd.</div>
                </div>
            </div>
            <div class="loading-container no-display" id="loading-container">
                <div class="loading-animation"></div>
                <div class="loading-description" id="loading-description"></div>
            </div>
        </div>
    </body>
</html>
