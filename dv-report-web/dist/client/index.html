<!doctype html>
<html lang="en">
    <head>
        <title>Submerge :: W3F DV Cohort IV Report</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
        />
        <link rel="stylesheet" href="./css/style.css" />
        <script src="https://kit.fontawesome.com/ebf2cd1147.js" crossorigin="anonymous"></script>
        <script defer data-domain="dv.report" src="https://plausible.io/js/script.js"></script>
    </head>
    <body id="root" class="regular">
        <script src="./bundle.js"></script>
        <div class="page-header-container">
            <div class="page-header">
                <div class="logo-container-left">
                    <span>developed by</span>
                    <img class="helikon-logo" src="./img/helikon-logo.svg" alt="Helikon" />
                </div>
                <!--img class="helikon-logo-full" src="./img/helikon-logo-full.svg" alt="Helikon"-->
                <div class="logo-container-right">
                    <span>powered by</span>
                    <img class="submerge-logo" src="./img/submerge-logo.svg" alt="Submerge" />
                </div>
            </div>
            <hr />
        </div>
        <div class="filter-container" id="filter-container">
            <div class="filter-item">
                <div class="filter-item-title">Network:</div>
                <select class="filter-item-select" id="network-select"></select>
            </div>
            <div class="filter-item">
                <div class="filter-item-title">Track:</div>
                <select class="filter-item-select" id="track-select"></select>
            </div>
            <div class="filter-item">
                <div class="filter-item-title">Status:</div>
                <select class="filter-item-select" id="status-select"></select>
            </div>
        </div>
        <div class="content-container">
            <div class="content" id="content">
                <div class="header-1 medium">W3F Decentralized Voices Cohort IV Report</div>
                <!-- activity -->
                <div class="section">
                    <div class="section-header">Vote Counts</div>
                    <div class="section-body">
                        <svg id="vote-count-chart"></svg>
                    </div>
                </div>
                <!-- policy -->
                <div class="section">
                    <div class="section-header">Policy Direction</div>
                    <div class="section-body">
                        <svg id="policy-direction-chart"></svg>
                    </div>
                </div>
                <!-- similarity -->
                <div class="section">
                    <div class="section-header">Similarity Matrix</div>
                    <div class="section-body">
                        <svg id="similarity-matrix-chart"></svg>
                    </div>
                </div>
                <!-- response time -->
                <div class="section">
                    <div class="section-header">Average First Vote Time</div>
                    <div class="section-body">
                        <svg id="first-vote-time-chart"></svg>
                    </div>
                </div>
                <!-- vote changes -->
                <!--div class="section">
                    <div class="section-header">Vote Changes</div>
                    <div class="section-body"></div>
                </div-->
                <!-- vote list -->
                <div class="section">
                    <div class="section-header">Votes</div>
                    <div class="section-body">
                        <div id="vote-list-container" class="vote-list-container">
                            <div id="vote-list-delegate-column" class="delegate-column"></div>
                            <div class="vote-list-scroll-container">
                                <div id="vote-list" class="vote-list"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="loading-container no-display" id="loading-container">
                <div class="loading-animation"></div>
                <div class="loading-description-container">
                    <span class="loading-description" id="loading-description"></span>
                </div>
            </div>
        </div>
    </body>
</html>
